name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

        **Security vulnerabilities**: Do NOT report security issues here. Follow [SECURITY.md](https://github.com/olederkach/bcdocker/blob/master/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `bcd create --name ...`
        2. See error ...
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      description: How are you using bcdocker?
      options:
        - CLI (bcd command)
        - MCP Server (Cursor/Claude/VS Code)
        - PowerShell Module (Import-Module)
        - EXE (BCDocker.exe)
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP Client (if applicable)
      description: Which MCP client are you using?
      options:
        - N/A (using CLI)
        - Claude Desktop
        - VS Code (GitHub Copilot)
        - Cursor
        - Other (specify in description)
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package Version
      description: "Run: bcd --version"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages or logs. **Remove all credentials and tokens before posting.**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: security-check
    attributes:
      label: Security Checklist
      options:
        - label: I have removed all credentials, tokens, and secrets from this report
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true
